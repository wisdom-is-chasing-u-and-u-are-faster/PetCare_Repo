<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Enterprise Digital Banking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl border border-slate-200 shadow-md">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-blue-600 rounded-xl mx-auto flex items-center justify-center text-white font-bold text-2xl shadow mb-3">DB</div>
      <h1 class="text-2xl font-bold text-slate-900">Sign In to Digital Banking</h1>
      <p class="text-xs text-slate-500 mt-1">OAuth 2.0 / FAPI 2.0 Secure Channel</p>
    </div>

    <form id="login-form" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label for="email">Corporate Email</label>
        <input type="email" id="email" value="admin@bank.com" required class="form-control">
      </div>

      <div class="form-group">
        <div class="flex justify-between items-center mb-1">
          <label for="password" class="mb-0">Password</label>
          <a href="#" class="text-xs text-blue-600 hover:underline">Forgot password?</a>
        </div>
        <input type="password" id="password" value="password123" required class="form-control">
      </div>

      <div class="flex items-center justify-between mb-6">
        <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
          <input type="checkbox" id="remember-me" class="rounded text-blue-600">
          <span>Remember this device</span>
        </label>
      </div>

      <button type="submit" id="btn-login" class="w-full btn btn-primary">
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
      <span>Need an enterprise account?</span>
      <a href="/pages/onboarding.html" class="text-blue-600 font-semibold hover:underline ml-1">Onboard Now</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('password').value;
      const remember = document.getElementById('remember-me').checked;

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      try {
        const res = await BankingAPI.login(email, pwd, remember);
        localStorage.setItem('auth_token', res.token);
        localStorage.setItem('user_name', res.user.full_name);
        showNotice(`Welcome back, ${res.user.full_name}!`);
        setTimeout(() => {
          window.location.href = '/pages/dashboard.html';
        }, 800);
      } catch (err) {
        showNotice(err.message, true);
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
